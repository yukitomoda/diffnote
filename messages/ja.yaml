      ポート {port} で待ち受けを始められませんでした
    port_unknown: |-
      待ち受けているポートを調べられませんでした

# --- 実行時のメッセージ(画像/添付、bundle 読み込み、ディレクトリ読み込み) --
image:
  empty: |-
    画像が空です
  unsupported_format: |-
    この形式の画像は添付できません(PNG、JPEG、GIF、WebP、SVG)
  svg_runs: |-
    スクリプトなどを含む SVG は添付できません
  svg_external_ref: |-
    外部を参照する SVG は添付できません

create:
  internal_file_missing: |-
    内部エラー: ファイル '{file}' が差分にありません

review:
  bad_event: |-
    {source}:{line}: 記録の形式が不正です
  open_failed: |-
    {path} を開けませんでした

files:
  walk_failed: |-
    ディレクトリをたどれませんでした
