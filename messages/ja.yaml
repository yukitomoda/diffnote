# diffnote の画面・CLI に出てくる文言(日本語)。
#
# ネストしたマッピングで、葉(文字列)がそのままメッセージです。Rust/JS
# からは `.` で連結したパス(例: `cli.init.about`)で引き、`{name}` は実行
# 時に値へ置き換わります。読み込み側は src/messages.rs と ui/client/lib.js。
#
# 書きかた: 短く、ユーザーがその場で必要なことだけ。仕組みの説明や理由は
# 書かない(詳しいことは README へ)。

# --- CLI (`diffnote --help` などに出る文言) ---------------------------------
cli:
  about: |-
    git の差分やディレクトリにコメントを書き、レビューを 1 つのファイルで共有する。
  help_flag: |-
    ヘルプを表示する
  version_flag: |-
    バージョンを表示する
  heading_args: |-
    引数
  heading_options: |-
    オプション
  heading_commands: |-
    コマンド
  help_template: |-
    {about}

    使い方: {usage}

    {all-args}

  init:
    about: |-
      レビューを新しく作り、比較の基準を決める。
    review: |-
      作るレビューのパス(省略時は ./.diffnote)。
    target: |-
      基準にするコミット、またはディレクトリ(省略時は HEAD、git の外では `.`)。
    files: |-
      git の中でも、ディレクトリのレビューにする。
    repo: |-
      対象の git リポジトリ(省略時はカレント)。
    title: |-
      レビューのタイトル。

  edit:
    about: |-
      $EDITOR でコメントを書き、レビューに追記する。
    review: |-
      レビューのパス(省略時は ./.diffnote)。
    target: |-
      レビューするコミット、またはディレクトリ(省略時は HEAD、ディレクトリのレビューでは `.`)。
    base: |-
      比較の起点。まだレビューがないときだけ指定できる。
    files: |-
      git の中でも、ディレクトリのレビューにする。
    repo: |-
      対象の git リポジトリ(省略時はカレント)。
    snapshot: |-
      レビューに保存する範囲。`changed`(差分が触れたファイルだけ)か `full`(ツリー全体)。
    show: |-
      差分に出ていない箇所もコメントできるようにする(`PATH`、`PATH:LINE`、`PATH:START-END`)。繰り返し指定できる。
    title: |-
      レビューのタイトルを設定する(`--title ""` で取り消す)。
    reopen: |-
      差分を計算せず、最後のリビジョンを開き直す(コメントの追加用)。

  serve:
    about: |-
      レビューをブラウザで見る(自分のパソコンからだけ接続できる)。
    review: |-
      レビューのパス(省略時は ./.diffnote)。
    port: |-
      待ち受けるポート(省略時は自動)。
    open: |-
      起動したあと、ブラウザで開く。
    repo: |-
      対象の git リポジトリ(省略時はカレント)。
    target: |-
      レビューに加えるコミット、またはディレクトリ(省略時は HEAD)。
    base: |-
      比較の起点。まだレビューがないときだけ指定できる。
    files: |-
      git の中でも、ディレクトリのレビューにする。
    reopen: |-
      差分を計算せず、最後のリビジョンだけを開く(コメントの追加用)。

  show:
    about: |-
      レビューのコメントを一覧する。
    review: |-
      レビューのパス(省略時は ./.diffnote)。

  export:
    about: |-
      レビューを、単体で開ける HTML に書き出す。
    review: |-
      レビューのパス(省略時は ./.diffnote)。
    output: |-
      出力する HTML のパス。
    output_pos: |-
      出力する HTML のパス(`-o` の代わりに指定できる)。
    expand_limit_value_name: |-
      行数|all
    expand_limit: |-
      差分に出ていない行を HTML に含める上限(`0` で含めない、`all` で全部)。

  config:
    about: |-
      このマシンで使う設定(作者名など)。すべてのレビューに効く。
    get:
      about: |-
        設定を表示する(KEY を省略すると全部)。
      key: |-
        表示する項目(`author`)。
    set:
      about: |-
        設定する。
      key: |-
        設定する項目(`author`)。
      value: |-
        設定する値。
    unset:
      about: |-
        設定を取り消す。
      key: |-
        取り消す項目(`author`)。

# --- 実行時のメッセージ(main.rs) -------------------------------------------
main:
  macro:
    stdout_write_failed: |-
      標準出力に書き込めませんでした: {error}
  output_path_conflict: |-
    出力パスは 1 つだけ指定してください
  output_path_missing: |-
    出力パスを指定してください(例: `diffnote export out.html`)
  no_bundle: |-
    {path} がありません。レビューするコミットを指定するか、先に `diffnote init` を実行してください
  needs_a_base: |-
    比較の起点を `--base DIR` で指定するか、先に `diffnote init` を実行してください
  title_set: |-
    タイトルを設定しました
  warning_prefix: |-
    警告: {warning}
  notice_prefix: |-
    注意: {notice}

  config:
    not_set: |-
      {key} は設定されていません
    none_set: |-
      何も設定されていません
    file_path: |-
      設定ファイル: {path}
    entry: |-
      {key} = {value}
    empty_value_refused: |-
      空の値は設定できません(取り消すには `diffnote config unset {key}`)
    set_ok: |-
      {key} を設定しました: {value}
    unset_ok: |-
      {key} の設定を取り消しました

  repo_of:
    not_a_repo: |-
      {dir} は git リポジトリではありません

  add_revision:
    recorded_git: |-
      差分を記録しました: {from}..{to}
    recorded_files: |-
      ディレクトリの変更を記録しました

  reopen:
    conflicting_flags: |-
      --reopen は、比較対象や --base、--files とは一緒に指定できません
    edit_conflicts_snapshot: |-
      --reopen は --snapshot とは一緒に指定できません
    edit_conflicts_show: |-
      --reopen は --show とは一緒に指定できません
    input_no_revision: |-
      保存されたリビジョンがありません。先に `diffnote edit` でレビューを作ってください

  serve:
    reopen_no_bundle: |-
      {path} がありません。--reopen には、すでにあるレビューが必要です
    no_revision: |-
      {path} に、保存されたリビジョンがありません
    refresh_failed: |-
      注意: 最新の差分を取り込めませんでした: {error}
    no_diff_at_all: |-
      レビューする差分がありません
    no_diff_yet: |-
      注意: レビューする差分がまだありません。コミットを重ねてから、もう一度実行してください
    at: |-
      {url}
    opening_browser: |-
      ブラウザで開きます: {url}
    quit_hint: |-
      終了するには、Ctrl+C か、ブラウザの「終了」ボタンを押してください
    open_failed: |-
      ブラウザを開けませんでした。上の URL を貼り付けてください

  export:
    expand_limit_invalid: |-
      行数(0 以上の整数)か `all` を指定してください
    no_diff: |-
      {path} に記録された差分がありません。先に `diffnote edit` を実行してください
    write_failed: |-
      {path} を書き込めませんでした
    wrote: |-
      {path} を書き出しました

  git_range:
    no_ranges: |-
      範囲(`A..B`)は指定できません。比較対象は 1 つだけ指定してください
    base_locked: |-
      このバンドルのベースは {base} です。ベースは変えられません
    dir_bundle: |-
      このバンドルはディレクトリのレビューです(コミットは指定できません)
    no_target: |-
      レビューするコミットを指定するか、先に `diffnote init` を実行してください

  files_input:
    no_snapshot: |-
      バンドルに、比べる対象のスナップショットがありません

  check_files_base:
    mismatch: |-
      {dir} は、このバンドルのベースと違います。ベースは変えられません

  init:
    already_exists: |-
      {path} はすでに存在します
    git_done: |-
      {rev}({commit}) を基準に {path} を作成しました。`diffnote edit` でレビューを始められます
    files_done: |-
      {count} 個のファイルを {path} に保存しました

  edit:
    show_parse_failed: |-
      --show {spec}: {error}
    dir_snapshot_changed_refused: |-
      ディレクトリのレビューでは `--snapshot changed` は指定できません。不要なものは `.diffnoteignore` で除外してください
    resuming_draft: |-
      前回の下書きから再開します: {path}
    temp_dir_failed: |-
      一時ディレクトリを作れませんでした
    temp_write_failed: |-
      一時ファイルに書き込めませんでした
    editor_empty: |-
      $EDITOR が空です。エディタのコマンドを設定してください
    editor_launch_failed: |-
      エディタ '{editor}' を起動できませんでした($EDITOR を確認してください)
    read_back_failed: |-
      編集したファイルを読み戻せませんでした
    editor_failed: |-
      エディタ '{editor}' が異常終了しました。編集内容は {path} に残しました
    parse_failed: |-
      編集内容を解釈できませんでした: {error}

      編集内容は {path} に残しました。直して `diffnote edit` を再実行すると、続きから再開できます
    no_diff: |-
      レビューする変更がありません
    no_comments: |-
      コメントは追加されませんでした
    reanchor_conflict: |-
      '>!reanchor' は、コメント本文や他のディレクティブと同じブロックには書けません
    reanchor_bad_id: |-
      '>!reanchor {id}': スレッド ID として正しくありません
    internal_unknown_thread_ref: |-
      内部エラー: 不明なスレッド参照です
    no_changes: |-
      変更はありません
    saved: |-
      コメント {comments} 件を {path} に書き込みました

  show:
    empty: |-
      {path} は空です
    setting_title: |-
      [設定] タイトル={title}
    setting_ignore_whitespace: |-
      [設定] 空白の違いを無視(初期表示)
    setting_attachment_limit: |-
      [設定] 添付ファイルの上限={bytes} バイト
    meta: |-
      [メタ] context_lines={context_lines}
    revision: |-
      [リビジョン] {id} digest={digest} 対象={target} スナップショット={mode}
    dir_marker: |-
      (ディレクトリ)
    title: |-
      [タイトル] {title} -- {author}
    ignore_whitespace_on: |-
      無視する
    ignore_whitespace_off: |-
      無視しない
    ignore_whitespace_change: |-
      [設定] 空白の違いを{state} -- {author}
    pin: |-
      [固定] リビジョン {revision}: {count} 個のファイル
    new_comment: |-
      [{id}] 新規  {where} -- {author}
    reply: |-
      [{id}] 返信 -> {parent} -- {author}
    resolve: "      解決 {parent} -- {author}"
    reopen: "      再オープン {parent} -- {author}"
    reanchor: "      再アンカー {parent} -> {where} -- {author}"

  anchor:
    insert_position: |-
      {file}:{line} (挿入位置)
    single_line: |-
      {file}:{line}
    range: |-
      {file}:{start}-{end}
    unknown: |-
      ?
    global: |-
      差分全体
    whole_file: |-
      ファイル全体: {file}
    moved: |-
      {head} <- {base}
    deleted: |-
      {span} (削除)

  push_directive:
    internal_error: |-
      内部エラー: {directive} を処理できません

  save_draft:
    failed: |-
      下書きを {path} に保存できませんでした

  snapshot:
    ignore_hint: |-
      不要なものは `.diffnoteignore` で除外できます
    confirm_prompt: "代わりに `changed`(この差分が触れるファイルだけ)にしますか? [y/N] "

# --- 実行時のメッセージ(serve.rs、ブラウザの画面が受け取るもの) -----------
serve:
