name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the running one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }} / rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is a hard requirement, so it is tested like Linux.
          - { os: ubuntu-latest, toolchain: stable }
          - { os: windows-latest, toolchain: stable }
          # The oldest Rust the crate supports (`rust-version` in Cargo.toml).
          - { os: ubuntu-latest, toolchain: "1.88" }
    steps:
      # Keep line endings as committed: the sources and test data are LF.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        # Warnings are errors, but only on stable: a new Rust adds lints, and
        # the oldest one is here to check that the code builds and passes.
        if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
