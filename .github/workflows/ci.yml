name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the running one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.os }} / rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is a hard requirement, so it is tested like Linux.
          - { os: ubuntu-latest, toolchain: stable }
          - { os: windows-latest, toolchain: stable }
          # The oldest Rust the crate supports (`rust-version` in Cargo.toml).
          - { os: ubuntu-latest, toolchain: "1.88" }
    steps:
      # Keep line endings as committed: the sources and test data are LF.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        # Formatting doesn't depend on the platform, so once is enough.
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: JavaScript syntax
        # The page's script is a plain file (see ui/README.md); Node is on
        # the runner.
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: node --check ui/app.js && node --check ui/client/lib.js && node --check ui/client/interact.js && node --check ui/client/app.js

      - name: JavaScript tests
        # Pure functions of the page (ui/client/lib.js), with Node's own runner.
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: node --test ui/client/test/*.test.js

      - name: Clippy
        # Warnings are errors, but only on stable: a new Rust adds lints, and
        # the oldest one is here to check that the code builds and passes.
        if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # The page, in a real browser (see tests/browser/README.md). Chrome is on
  # the Ubuntu runner.
  browser:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test the page
        run: python3 -m unittest discover -s tests/browser -v
