name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the running one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The page is built with node, once, and every other job takes that same
  # bundle (the binary carries it: see ui/README.md). So node is needed here and
  # nowhere else, and everything is checked against one build of the page.
  client:
    name: the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm --prefix ui ci

      - name: Types
        # esbuild strips the types without looking at them, so they are checked
        # here (what is still JavaScript is not checked).
        run: npm --prefix ui run typecheck

      - name: Build
        run: npm --prefix ui run build

      - name: Test
        # What the page is built from, under Node's own test runner.
        run: npm --prefix ui test

      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          include-hidden-files: true # ui/dist/.sources, which build.rs reads
          if-no-files-found: error

  test:
    name: ${{ matrix.os }} / rust ${{ matrix.toolchain }}
    needs: client
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is a hard requirement, so it is tested like Linux.
          - { os: ubuntu-latest, toolchain: stable }
          - { os: windows-latest, toolchain: stable }
          # The oldest Rust the crate supports (`rust-version` in Cargo.toml).
          - { os: ubuntu-latest, toolchain: "1.88" }
    steps:
      # Keep line endings as committed: the sources and test data are LF.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        # Formatting doesn't depend on the platform, so once is enough.
        if: matrix.toolchain == 'stable' && runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        # Warnings are errors, but only on stable: a new Rust adds lints, and
        # the oldest one is here to check that the code builds and passes.
        if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # The page, in a real browser (see tests/browser/README.md). Chrome is on
  # the Ubuntu runner.
  browser:
    name: browser tests
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test the page
        run: python3 -m unittest discover -s tests/browser -v
