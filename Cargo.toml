[package]
name = "diffnote"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing"] }
sha2 = "0.10"
similar = "2"
base64 = "0.22"
tempfile = "3"
pulldown-cmark = "0.12"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ignore = "0.4"
tiny_http = "0.12.0"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
dirs = "7.0.0"

# The dependencies that read syntax definitions and color code are slow
# unoptimized (seconds per run in a debug build): keep them optimized.
[profile.dev.package."*"]
opt-level = 2
